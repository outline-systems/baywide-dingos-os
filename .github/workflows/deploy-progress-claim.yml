name: Apply Baywide progress-claim patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-progress-claim.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch to bundled app template
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/deploy.patch.xz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/deploy.patch.xz.b64 > /tmp/deploy.patch.xz
          xz -dc /tmp/deploy.patch.xz > /tmp/deploy.patch

          python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path('index.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'(<script type="__bundler/template">)(.*?)(</script>)', text, re.S)
          if not m:
              raise SystemExit('Bundled template block not found')
          template = json.loads(m.group(2))
          pathlib.Path('/tmp/template.html').write_text(template, encoding='utf-8')
          PY

          patch --batch --forward /tmp/template.html /tmp/deploy.patch

          python3 - <<'PY'
          import json, pathlib, re
          p = pathlib.Path('index.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'(<script type="__bundler/template">)(.*?)(</script>)', text, re.S)
          if not m:
              raise SystemExit('Bundled template block not found during repack')
          updated = pathlib.Path('/tmp/template.html').read_text(encoding='utf-8')
          encoded = json.dumps(updated, ensure_ascii=False, separators=(',', ':'))
          encoded = re.sub(r'</script', r'<\\/script', encoded, flags=re.I)
          rebuilt = text[:m.start(2)] + encoded + text[m.end(2):]
          p.write_text(rebuilt, encoding='utf-8')
          PY

          grep -q 'Export claim PDF' index.html
          grep -q 'PROGRESS CLAIM' index.html
          grep -q 'Tax Invoice' index.html

      - name: Commit live build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git commit -m 'Separate progress claims from tax invoices'
          git push
