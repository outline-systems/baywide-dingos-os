name: Visual guide QA

on:
  push:
    branches:
      - qa-visual-guides
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/baywide-server.log 2>&1 &
          sleep 2
      - name: Verify Field workflow
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const clean = s => (s||'').replace(/\s+/g,' ').trim();
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            fs.mkdirSync('qa-screens',{recursive:true});
            const snap=async n=>{await p.screenshot({path:`qa-screens/${n}.png`,fullPage:true}); console.log(`\n---${n}---\n${clean(await p.locator('body').innerText()).slice(0,9000)}\nBUTTONS ${JSON.stringify((await p.locator('button').allTextContents()).map(clean).filter(Boolean))}`)};
            const clickBtn=async(re,n)=>{const b=p.getByRole('button',{name:re}); if(!await b.count()) throw new Error(`Missing button ${re}`); await b.first().click({force:true}); await p.waitForTimeout(500); if(n) await snap(n);};

            await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const fieldSwitch=p.locator('button[title="Field app"]');
            if(!await fieldSwitch.count()) throw new Error('Field app switch missing');
            await fieldSwitch.first().click({force:true}); await p.waitForTimeout(500); await snap('01-field-home');
            await clickBtn(/^Sign in$/i,'02-sign-in-picker');
            await clickBtn(/Operator #1/i,'03-signed-in');

            const body3=clean(await p.locator('body').innerText());
            if(/Sign in to the field app/i.test(body3)) throw new Error('Worker picker did not close after selecting Operator #1');
            if(!/Operator #1/i.test(body3)) throw new Error('Operator #1 not active after sign-in');

            const job=p.locator('button').filter({hasText:'101 Example Street'}).first();
            if(!await job.count()) throw new Error('Assigned job card missing');
            await job.click({force:true}); await p.waitForTimeout(500); await snap('04-job-open-before-clock');
            const body4=clean(await p.locator('body').innerText());
            console.log('JOB_OPEN_HAS_CLOCK=',/Clock (in|on)/i.test(body4));
            console.log('JOB_OPEN_HAS_HS=',/H&S|Safety|sign-on/i.test(body4));

            let clock=p.getByRole('button',{name:/Clock (in|on)/i});
            if(await clock.count()){await clock.first().click({force:true}); await p.waitForTimeout(500); await snap('05-after-clock');}

            for(const re of [/Create & sign/i,/H&S.*sign/i,/Safety/i]){
              const b=p.getByRole('button',{name:re});
              if(await b.count()){await b.first().click({force:true}); await p.waitForTimeout(500); await snap('06-safety-sign-on'); break;}
            }

            let back=p.getByRole('button',{name:/Back|Done|Cancel|Close/i});
            if(await back.count()){try{await back.first().click({force:true}); await p.waitForTimeout(400);}catch(e){}}
            await snap('07-work-hub');

            const targets=[[/Update progress|Progress/i,'08-progress'],[/Photo/i,'09-photos'],[/Variation/i,'10-variation'],[/Material/i,'11-materials'],[/hazard|Safety/i,'12-hazard'],[/task/i,'13-tasks'],[/Progress report/i,'14-progress-report']];
            for(const [re,name] of targets){
              const b=p.getByRole('button',{name:re});
              if(await b.count()){
                try{await b.first().click({force:true}); await p.waitForTimeout(350); await snap(name); const rb=p.getByRole('button',{name:/Back|Done|Cancel|Close/i}); if(await rb.count()) await rb.first().click({force:true}); else await p.goBack(); await p.waitForTimeout(300);}catch(e){console.log('TARGET_FAIL',name,e.message)}
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baywide-field-qa-final
          path: qa-screens
          if-no-files-found: error
