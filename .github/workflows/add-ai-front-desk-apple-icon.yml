name: Add AI Front Desk Apple Touch Icon

on:
  push:
    paths:
      - '.github/workflows/add-ai-front-desk-apple-icon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Apple touch icon link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ai-front-desk/index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">'

          if tag not in html:
              marker = '<link rel="icon"'
              pos = html.find(marker)
              if pos == -1:
                  raise SystemExit('Could not find favicon link in ai-front-desk/index.html')
              html = html[:pos] + tag + html[pos:]
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "outline-systems"
          git config user.email "austen@outlineprojects.nz"
          git add ai-front-desk/index.html
          if git diff --cached --quiet; then
            echo "Apple touch icon tag already present."
          else
            git commit -m "Add AI Front Desk Apple touch icon support"
            git push
          fi
