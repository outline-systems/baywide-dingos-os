name: TradeOS QA

on:
  push:
    branches:
      - trade-os-master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve TradeOS
        run: |
          cd tradeos
          python3 -m http.server 4173 >/tmp/tradeos.log 2>&1 &
          sleep 2
      - name: Smoke test desktop and mobile
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const cfg of [{name:'desktop',viewport:{width:1440,height:1000}},{name:'mobile',viewport:{width:390,height:844},isMobile:true}]){
              const p=await browser.newPage(cfg);
              await p.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
              if(!await p.getByText('TradeOS',{exact:true}).count()) throw new Error(`${cfg.name}: TradeOS brand missing`);
              if(!await p.getByText('Run the office and the site from one place.').count()) throw new Error(`${cfg.name}: dashboard missing`);
              for(const label of ['Quotes','Projects','Field','Health & Safety','Claims','Invoices','Settings']){
                const b=p.getByRole('button',{name:label}).first();
                if(!await b.count()) throw new Error(`${cfg.name}: ${label} nav missing`);
                await b.click({force:true});
                await p.waitForTimeout(100);
              }
              await p.screenshot({path:`tradeos-${cfg.name}.png`,fullPage:true});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradeos-qa-screens
          path: tradeos-*.png
          if-no-files-found: warn
