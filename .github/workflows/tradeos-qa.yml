name: TradeOS QA

on:
  push:
    branches:
      - trade-os-master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve TradeOS
        run: |
          cd tradeos
          python3 -m http.server 4173 >/tmp/tradeos.log 2>&1 &
          sleep 2
      - name: Smoke test and capture main screens
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const screens=['Dashboard','Quotes','Projects','Schedule','Field','Health & Safety','Claims','Invoices','Reports','Settings'];
            const slug=s=>s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

            const desktop=await browser.newPage({viewport:{width:1440,height:1000}});
            await desktop.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
            if(!await desktop.getByText('TradeOS',{exact:true}).count()) throw new Error('desktop: TradeOS brand missing');
            for(const label of screens){
              if(label!=='Dashboard'){
                const b=desktop.getByRole('button',{name:label}).first();
                if(!await b.count()) throw new Error(`desktop: ${label} nav missing`);
                await b.click({force:true});
                await desktop.waitForTimeout(120);
              }
              await desktop.screenshot({path:`tradeos-desktop-${slug(label)}.png`,fullPage:true});
            }

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
            await mobile.goto('http://127.0.0.1:4173',{waitUntil:'networkidle'});
            for(const label of ['Dashboard','Field','Settings']){
              if(label!=='Dashboard'){
                const b=mobile.getByRole('button',{name:label}).first();
                if(!await b.count()) throw new Error(`mobile: ${label} nav missing`);
                await b.click({force:true});
                await mobile.waitForTimeout(120);
              }
              await mobile.screenshot({path:`tradeos-mobile-${slug(label)}.png`,fullPage:true});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tradeos-main-screens
          path: tradeos-*.png
          if-no-files-found: warn
