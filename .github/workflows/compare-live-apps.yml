name: Compare live Peak and Baywide

on:
  push:
    branches: [live-app-compare-20260907]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Deep compare live apps
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          fs.mkdirSync('compare-output/screens',{recursive:true});
          const clean=s=>(s||'').replace(/\s+/g,' ').trim();
          const keys=['progress claim','tax invoice','technical spec','technical specification','methodology','paint spec','colour schedule','tender h&s policy','h&s policy','google calendar','calendar','planned labour','crew photo','profile photo','rates library','rate library','company details','company logo','save company','export claim pdf','claim pdf','variation','materials','daily tasks','progress report','field','my jobs','clock in','clock on','earthworks','landscaping','drainage','painting','coating','spray','square metre','m²','crew','schedule'];
          const hits=t=>{t=(t||'').toLowerCase();return Object.fromEntries(keys.map(k=>[k,(t.match(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length]));};
          async function snap(page,app,name){await page.waitForTimeout(500);const body=clean(await page.locator('body').innerText().catch(()=>''));const buttons=(await page.locator('button:visible').allTextContents().catch(()=>[])).map(clean).filter(Boolean);const labels=(await page.locator('label:visible').allTextContents().catch(()=>[])).map(clean).filter(Boolean);const inputs=await page.locator('input:visible,textarea:visible,select:visible').evaluateAll(els=>els.map(e=>({type:e.type||'',name:e.name||'',placeholder:e.placeholder||'',value:(e.type==='password'?'':e.value||''),aria:e.getAttribute('aria-label')||''}))).catch(()=>[]);await page.screenshot({path:`compare-output/screens/${app}-${name}.png`,fullPage:true});return {body,buttons,labels,inputs,keywords:hits(body)};}
          async function clickVisible(page,re){const all=page.locator('button:visible,a:visible,[role="button"]:visible');const c=all.filter({hasText:re});if(await c.count()){await c.first().click({force:true});await page.waitForTimeout(650);return true;}return false;}
          async function gotoRoot(page,url){await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1400);}
          async function enterHQ(page){const b=page.getByRole('button',{name:/Management/i}).filter({visible:true});if(await b.count()){await b.first().click({force:true});await page.waitForTimeout(650);return true;}return clickVisible(page,/Management/);}
          async function nav(page,label){const exact=page.getByRole('button',{name:label,exact:true});for(let i=0;i<await exact.count();i++){if(await exact.nth(i).isVisible().catch(()=>false)){await exact.nth(i).click({force:true});await page.waitForTimeout(600);return true;}}return clickVisible(page,new RegExp(`^${label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}$`,'i'));}
          async function inspect(browser,app,url){const page=await browser.newPage({viewport:{width:1440,height:1100}});const o={app,url,screens:{},notes:[]};await gotoRoot(page,url);o.screens.welcome=await snap(page,app,'welcome');await enterHQ(page);o.screens.dashboard=await snap(page,app,'dashboard');
            for(const label of ['Settings','Rates library','Contacts','Timesheets','Invoicing']){await nav(page,label);o.screens[label.toLowerCase().replace(/\s+/g,'-')]=await snap(page,app,label.toLowerCase().replace(/\s+/g,'-'));}
            // New invoice form/modal, without saving.
            await nav(page,'Invoicing');if(await clickVisible(page,/^New invoice$/i))o.screens['new-invoice']=await snap(page,app,'new-invoice');
            // Quote builder from current first lead/quote.
            await nav(page,'Quotes');if(await clickVisible(page,/Build quote/i))o.screens['quote-builder']=await snap(page,app,'quote-builder');
            // Tender detail.
            await nav(page,'Tendering');let tender=page.locator('button:visible').filter({hasText:/TND-|PP-0501|TEST TENDER|Example Residential/i});if(await tender.count()){await tender.first().click({force:true});await page.waitForTimeout(650);o.screens['tender-detail']=await snap(page,app,'tender-detail');}
            else o.notes.push('Tender detail row not clickable');
            // Project detail.
            await nav(page,'Projects');let proj=page.locator('button:visible').filter({hasText:/PJ-/});if(await proj.count()){await proj.first().click({force:true});await page.waitForTimeout(650);o.screens['project-detail']=await snap(page,app,'project-detail');} else {const tx=page.getByText(/PJ-\d+/).first();if(await tx.count()){await tx.click({force:true});await page.waitForTimeout(650);o.screens['project-detail']=await snap(page,app,'project-detail');}else o.notes.push('Project detail not clickable');}
            // Field signed-out + crew picker.
            await gotoRoot(page,url);let fsw=page.locator('button[title="Field app"]:visible');if(await fsw.count()){await fsw.first().click({force:true});await page.waitForTimeout(650);} else await clickVisible(page,/Field · Mobile|^Field$/i);o.screens.field=await snap(page,app,'field');if(await clickVisible(page,/^Sign in$/i))o.screens['field-sign-in']=await snap(page,app,'field-sign-in');
            await page.close();return o;}
          (async()=>{const browser=await chromium.launch({headless:true});const bay=await inspect(browser,'baywide','https://outline-systems.github.io/baywide-dingos-os/');const peak=await inspect(browser,'peak','https://outline-systems.github.io/peak-paint-os/');await browser.close();const names=[...new Set([...Object.keys(bay.screens),...Object.keys(peak.screens)])];const comparison={};for(const n of names){const b=bay.screens[n]||{},p=peak.screens[n]||{};comparison[n]={baywide:b,peak:p};}fs.writeFileSync('compare-output/deep-report.json',JSON.stringify({generatedAt:new Date().toISOString(),baywide:bay,peak,comparison},null,2));console.log('=== DEEP LIVE COMPARISON ===');console.log('BAY_NOTES',JSON.stringify(bay.notes));console.log('PEAK_NOTES',JSON.stringify(peak.notes));for(const n of names){const b=bay.screens[n]||{},p=peak.screens[n]||{};console.log(`\n--- ${n.toUpperCase()} ---`);console.log('BAY:',(b.body||'').slice(0,7000));console.log('PEAK:',(p.body||'').slice(0,7000));console.log('BAY_BUTTONS:',JSON.stringify(b.buttons||[]));console.log('PEAK_BUTTONS:',JSON.stringify(p.buttons||[]));console.log('BAY_LABELS:',JSON.stringify(b.labels||[]));console.log('PEAK_LABELS:',JSON.stringify(p.labels||[]));console.log('BAY_KEYWORDS:',JSON.stringify(b.keywords||{}));console.log('PEAK_KEYWORDS:',JSON.stringify(p.keywords||{}));}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peak-vs-baywide-live-comparison-deep
          path: compare-output
          if-no-files-found: error
